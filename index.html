<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Quiz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f9f4;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2e7d32;
            text-align: center;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🥗 Nutrition Quiz</h2>
    <form id="quizForm">
        <label for="goal">What is your goal?</label>
        <select id="goal">
            <option value="weight_loss">Lose weight</option>
            <option value="muscle_gain">Gain muscle</option>
            <option value="healthy_eating">Eat healthy</option>
        </select>

        <label for="meals">How many times a day do you eat?</label>
        <input type="number" id="meals" min="1" max="10" placeholder="For example, 3">

        <label for="water">How much water do you drink (in liters)?</label>
        <input type="number" id="water" step="0.1" min="0" placeholder="For example, 1.5">

        <button type="button" onclick="sendData()">Submit 🚀</button>
    </form>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendData() {
        const goal = document.getElementById('goal').value;
        const meals = document.getElementById('meals').value;
        const water = document.getElementById('water').value;

        if (!meals || !water) {
            alert('Please fill in all fields!');
            return;
        }

        const data = {
            goal: goal,
            meals: meals,
            water: water
        };

        tg.sendData(JSON.stringify(data));
        tg.close();
    }
</script>

</body>
</html>
